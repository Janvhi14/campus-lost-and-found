{% extends "base.html" %}
{% block content %}
<div class="p-5 mb-4 bg-white rounded shadow-sm text-center">
  <h1 class="display-6">Campus Lost &amp; Found Portal</h1>
  <p class="lead">Report lost or found items and let image matching find the owner.</p>
  <div class="d-flex justify-content-center gap-2 flex-wrap">
    {% if current_user.is_authenticated %}
      <a class="btn btn-danger" href="{{ url_for('items.report', kind='lost') }}">I lost something</a>
      <a class="btn btn-success" href="{{ url_for('items.report', kind='found') }}">I found something</a>
    {% else %}
      <a class="btn btn-primary" href="{{ url_for('auth.register') }}">Get started</a>
    {% endif %}
    <a class="btn btn-outline-primary" href="{{ url_for('items.list_items') }}">Browse items</a>
  </div>
</div>
{% endblock %}
